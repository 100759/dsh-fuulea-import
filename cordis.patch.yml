# 辅立码课导入成绩工作台（dsh-fuulea-import）
#
# 在「工作台」左侧面板列表里新增一个「导入成绩」入口；点击后进入整页工作台：
#   选择/切换学校 → 选择已发布的「考试×学科」任务 → 拖入成绩文件（xlsx/xls/csv 或 zip）
#   → 解析源文件 → 下载全通教育「班级对照表」模板并自动填充 → 预检 → 一键导入 → 核对平台回执。
# 账号只在本机保存一次（首次绑定后打开工作台自动登录，可切换多所学校）。
#
# 范围（第一版）：只做「平常考试」——任务已在平台发布，工作台负责 下模板→填充→预检→上传→核回执；
# 不做 绑卷 / 发布考试任务 / 阅卷分配 / 收尾。
#
# 配置项（全部可省略）：
#   defaultSchool    首次使用时的默认学校子域名，默认 lyyz（https://lyyz.fuulea.com）
#   bindingsFile     学校绑定存储路径，默认 ~/.fuulea-import/bindings.json
#   credentialsFile  兼容旧账号密码文件（格式「别名|账号|密码」），默认读取本机技能包凭据
#   outputDir        填好的模板输出目录，默认 <用户主目录>/.fuulea-import/output
#   pythonPath       python3 可执行文件路径，默认 python3
#   requestTimeoutMs 单次请求超时，默认 90000
- insert:
    - id: fuulea-import
      name: 'dsh-fuulea-import'
